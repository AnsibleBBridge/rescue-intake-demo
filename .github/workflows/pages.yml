# Builds the Leptos CSR demo with Trunk and publishes it to GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install Trunk 0.22.2
        run: |
          curl -fsSL https://github.com/trunk-rs/trunk/releases/download/v0.22.2/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          sudo mv trunk /usr/local/bin/trunk
          trunk --version
      - name: Test core logic
        run: cargo test -p rescue-core
      - name: Build site
        working-directory: crates/web
        run: trunk build --release --public-url /rescue-intake-demo/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: crates/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
