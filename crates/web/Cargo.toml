[package]
name = "web"
version = "0.1.0"
edition = "2021"

[dependencies]
rescue-core = { path = "../rescue-core" }
leptos = { version = "0.8", features = ["csr"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Storage", "Location", "Event"] }
wasm-bindgen = "0.2"
